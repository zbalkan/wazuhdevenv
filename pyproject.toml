[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhdevenv"
version = "0.4.0.dev0"
description = "Provision and operate a local Wazuh rule and decoder development environment"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Zafer Balkan", email = "zafer@zaferbalkan.com" },
]
keywords = ["wazuh", "detection-engineering", "pytest", "security", "development"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
]

[project.scripts]
wazuhdevenv = "wazuhdevenv.cli:main"

[project.urls]
Homepage = "https://github.com/zbalkan/wazuhdevenv"
Repository = "https://github.com/zbalkan/wazuhdevenv"
Issues = "https://github.com/zbalkan/wazuhdevenv/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wazuhdevenv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.mypy]
# wazuhdevenv is a POSIX/Linux-only application. Pinning the target keeps
# platform-specific APIs available when contributors run mypy from Windows.
platform = "linux"

[[tool.mypy.overrides]]
module = "pytest"
# Permit checking the application and tests when only the runtime dependency
# set is installed. The dev extra still installs pytest for normal development.
ignore_missing_imports = true
