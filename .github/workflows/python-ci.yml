name: Python CLI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -v

      - name: Static type checks
        run: python -m mypy .

      - name: CLI smoke tests
        run: |
          wazuhdevenv --help
          python -m wazuhdevenv --help

      - name: Build and smoke-test distribution
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/wazuhdevenv" --help
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m wazuhdevenv --help

          python -m venv "$RUNNER_TEMP/sdist-smoke"
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/sdist-smoke/bin/wazuhdevenv" --help
          "$RUNNER_TEMP/sdist-smoke/bin/python" -m wazuhdevenv --help
